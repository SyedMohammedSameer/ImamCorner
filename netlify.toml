# Pages render on Netlify Functions (Astro adapter) and read from Supabase.
# Set PUBLIC_SUPABASE_URL, PUBLIC_SUPABASE_PUBLISHABLE_KEY and SUPABASE_SECRET_KEY in the Netlify UI.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

# Old Google Sites paths → new pages
[[redirects]]
  from = "/welcome-page"
  to = "/"
  status = 301
[[redirects]]
  from = "/sheik-amir-koshin-bio"
  to = "/imams#amir-koshin"
  status = 301
[[redirects]]
  from = "/sheik-burhan-hamdan-bio"
  to = "/imams#burhan-hamdan"
  status = 301
[[redirects]]
  from = "/sheik-burhan-hamdan-office-hours"
  to = "/office-hours"
  status = 301
[[redirects]]
  from = "/jummah-khutbah-schedule"
  to = "/jummah"
  status = 301
