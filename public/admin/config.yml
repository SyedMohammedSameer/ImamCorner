# Imam's Corner staff editor (Decap CMS). Open https://<your-site>/admin/
# Login uses Netlify Identity + Git Gateway. Setup steps are in README.md.
backend:
  name: git-gateway
  branch: main
# Alternative without Netlify Identity (GitHub accounts with repo access):
# backend:
#   name: github
#   repo: <github-user>/<repo>
#   branch: main

site_url: /
display_url: /
logo_url: /icons/icon-512.png
locale: en
media_folder: public/files
public_folder: /files

collections:
  - name: resources
    label: Library (PDFs)
    label_singular: Document
    description: Khutbah notes, books, class handouts and guides. Upload a PDF and publish.
    folder: src/content/resources
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    sortable_fields: [date, title, type]
    summary: "{{title}} ({{type}}, {{date}})"
    fields:
      - { label: Title, name: title, widget: string }
      - label: Type
        name: type
        widget: select
        options: [{ label: Khutbah, value: khutbah }, { label: Book, value: book }, { label: Class notes, value: notes }, { label: Guide, value: guide }]
        default: khutbah
      - { label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: PDF file, name: pdf, widget: file, media_library: { config: { multiple: false } } }
      - { label: "Khateeb (for khutbahs)", name: khateeb, widget: relation, collection: imams, search_fields: [name], value_field: "{{slug}}", display_fields: [name], required: false }
      - { label: "Author (books & other documents)", name: author, widget: string, required: false }
      - { label: Short summary, name: summary, widget: text, required: false }
      - { label: Tags, name: tags, widget: list, required: false, default: [] }
      - { label: "Audio recording (optional mp3)", name: audio, widget: file, required: false }
      - { label: Feature on home page, name: featured, widget: boolean, default: false, required: false }
      - { label: Hide (draft), name: draft, widget: boolean, default: false, required: false }
      - { label: "Notes shown under the reader (optional)", name: body, widget: markdown, required: false }

  - name: schedule
    label: Jummah schedule
    files:
      - label: Khutbah rotation & changes
        name: schedule
        file: src/data/schedule.json
        fields:
          - label: Rotation
            name: rotation
            widget: object
            fields:
              - { label: Note, name: note, widget: text }
              - { label: "Anchor date (a Friday the rotating khateeb gave)", name: anchorDate, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - { label: "Every Nth week", name: everyNthWeek, widget: number, value_type: int, min: 1 }
              - { label: Rotating khateeb, name: rotatingKhateeb, widget: relation, collection: imams, search_fields: [name], value_field: "{{slug}}", display_fields: [name] }
              - { label: Default khateeb, name: defaultKhateeb, widget: relation, collection: imams, search_fields: [name], value_field: "{{slug}}", display_fields: [name] }
          - label: "Changes for specific Fridays"
            name: overrides
            widget: list
            summary: "{{fields.date}}: {{fields.khateeb}}"
            fields:
              - { label: Friday, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - { label: Khateeb, name: khateeb, widget: relation, collection: imams, search_fields: [name], value_field: "{{slug}}", display_fields: [name] }
              - { label: Topic, name: topic, widget: string, required: false }
              - { label: Note, name: note, widget: string, required: false }

  - name: classes
    label: Classes & office hours
    files:
      - label: Weekly timetable
        name: classes
        file: src/data/classes.json
        fields:
          - label: Programs
            name: programs
            widget: list
            summary: "{{fields.title}} ({{fields.time}})"
            fields:
              - { label: ID, name: id, widget: string, hint: "Short unique id, e.g. tafsir-sunday" }
              - { label: Title, name: title, widget: string }
              - { label: Arabic title, name: arabic, widget: string, required: false }
              - { label: Subtitle, name: subtitle, widget: string, required: false }
              - { label: Kind, name: kind, widget: select, options: [reminder, class, youth, quran] }
              - { label: Days, name: days, widget: select, multiple: true, options: [Mon, Tue, Wed, Thu, Fri, Sat, Sun] }
              - { label: Time, name: time, widget: string, hint: "e.g. After Isha, or 5:00 – 7:00 PM" }
              - { label: Presenter, name: presenter, widget: relation, collection: imams, search_fields: [name], value_field: "{{slug}}", display_fields: [name] }
              - { label: Audience, name: audience, widget: string }
          - label: Office hours
            name: officeHours
            widget: list
            summary: "{{fields.day}}: {{fields.time}}"
            fields:
              - { label: Day, name: day, widget: select, options: [Mon, Tue, Wed, Thu, Fri, Sat, Sun] }
              - { label: Time, name: time, widget: string }
          - { label: Office location, name: officeLocation, widget: string }

  - name: books
    label: Recommended books
    folder: src/content/books
    create: true
    slug: "{{slug}}"
    sortable_fields: [order, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Author, name: author, widget: string }
      - label: Category
        name: category
        widget: select
        options: ["Start here", "Qur’an & Tafsir", "Prophetic biography", "Hadith", "Spirituality", "Belief", "Family & youth"]
      - { label: Level, name: level, widget: select, options: [Beginner, Intermediate, Advanced] }
      - { label: Why read it, name: why, widget: text }
      - { label: "PDF in the library (optional)", name: resource, widget: relation, collection: resources, search_fields: [title], value_field: "{{slug}}", display_fields: [title], required: false }
      - { label: "External link (optional)", name: link, widget: string, required: false }
      - { label: Order, name: order, widget: number, value_type: int, default: 100 }

  - name: imams
    label: Imams
    folder: src/content/imams
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Full name, name: name, widget: string }
      - { label: Short name, name: shortName, widget: string, hint: "e.g. Sh. Burhan Hamdan" }
      - { label: Role, name: role, widget: string }
      - { label: Order, name: order, widget: number, value_type: int, default: 1 }
      - { label: Email, name: email, widget: string, required: false }
      - { label: Photo, name: photo, widget: image, required: false }
      - { label: Languages, name: languages, widget: list, required: false }
      - { label: Areas of focus, name: focus, widget: list, required: false }
      - { label: Biography, name: body, widget: markdown }

  - name: announcements
    label: Announcements
    folder: src/content/announcements
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Hide after (optional)", name: expires, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false }
      - { label: Link, name: link, widget: string, required: false }
      - { label: Link label, name: linkLabel, widget: string, required: false }
      - { label: Text, name: body, widget: markdown }

  - name: reminders
    label: Daily reminders
    files:
      - label: Ayah of the day
        name: reminders
        file: src/data/reminders.json
        fields:
          - label: Ayat
            name: ayat
            widget: list
            summary: "{{fields.ref}}"
            fields:
              - { label: Reference, name: ref, widget: string }
              - { label: Arabic, name: ar, widget: text }
              - { label: Translation, name: en, widget: text }
